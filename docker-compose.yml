services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: iot
    ports:
      - "5432:5432"

  mosquitto:
    image: eclipse-mosquitto:latest
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - mosquitto
    environment:
      - DB_URL=postgresql://admin:admin@postgres:5432/iot
      - MQTT_BROKER=mosquitto

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  mock_esp32:
    build: ./mock_esp32
    depends_on:
      - mosquitto
    environment:
      - MQTT_BROKER=mosquitto
